server:
  port: 8080

spring:
  application:
    name: gym_server

  # 1. 动态读取环境变量
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 拼接环境变量，并设置了本地回环地址作为默认值
    url: jdbc:mysql://${DATABASE_SERVER_IP:127.0.0.1}:${DATABASE_SERVER_PORT:3306}/${DATABASE_NAME:}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}

    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: info
    com.example.gym: debug

jwt:
  secret: gym_server_secret_key_2026_test_abcdefghijklmnopqrstuvwxyz
  expiration: 86400000